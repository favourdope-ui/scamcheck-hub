name: Validate ScamCheck Hub

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate app features and JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path("index.html").read_text(encoding="utf-8")
          required = [
              'id="message"', 'id="checkBtn"', 'id="reportForm"',
              'function analyzeMessage', 'api("checks"',
              'api("scam_reports"', 'status=eq.published',
              '/functions/v1/analyze-message', 'privacy.html', 'terms.html'
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit("Missing required app features: " + ", ".join(missing))
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          if not scripts:
              raise SystemExit("No inline application script found")
          Path("/tmp/scamcheck-app.js").write_text("\n".join(scripts), encoding="utf-8")
          for page in ["privacy.html", "terms.html"]:
              if not Path(page).exists():
                  raise SystemExit("Required public policy page is missing: " + page)
          function_file = Path("supabase/functions/analyze-message/index.ts")
          if not function_file.exists():
              raise SystemExit("Supabase analyze-message Edge Function source is missing")
          function = function_file.read_text(encoding="utf-8")
          for required_text in ["function analyzeMessage", "12,000 characters", "Access-Control-Allow-Origin"]:
              if required_text not in function:
                  raise SystemExit("Edge Function is missing: " + required_text)
          print("Required app and backend features found.")
          PY
          node --check /tmp/scamcheck-app.js
          deno check supabase/functions/analyze-message/index.ts
