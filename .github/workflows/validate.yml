name: Validate ScamCheck Hub

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate app features and JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path("index.html").read_text(encoding="utf-8")
          required = [
              'id="message"', 'id="checkBtn"', 'id="reportForm"', 'id="emailSignupForm"', 'id="authForm"', 'id="postForm"', 'id="imageReferenceForm"',
              'function analyzeMessage', 'api("checks"',
              'api("scam_reports"', 'email_registrations?on_conflict=email', 'status=eq.published', 'community_posts?select=id,author_id,author_name,body,created_at', 'post_comments', 'post_likes', 'image_signatures?select=id,image_hash,label,notes,created_at',
              '/functions/v1/analyze-message', 'privacy.html', 'terms.html'
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit("Missing required app features: " + ", ".join(missing))
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          if not scripts:
              raise SystemExit("No inline application script found")
          Path("/tmp/scamcheck-app.js").write_text("\n".join(scripts), encoding="utf-8")
          for page in ["privacy.html", "terms.html"]:
              if not Path(page).exists():
                  raise SystemExit("Required public policy page is missing: " + page)
          signup_migration = Path("supabase/migrations/20261029010000_email_registrations.sql")
          if not signup_migration.exists():
              raise SystemExit("Email registration migration is missing")
          migration_text = signup_migration.read_text(encoding="utf-8")
          if "create table if not exists public.email_registrations" not in migration_text or "enable row level security" not in migration_text:
              raise SystemExit("Email registration schema or RLS is missing")
          function_file = Path("supabase/functions/analyze-message/index.ts")
          if not function_file.exists():
              raise SystemExit("Supabase analyze-message Edge Function source is missing")
          function = function_file.read_text(encoding="utf-8")
          for required_text in ['import { analyzeMessage } from "./rules.ts"', "12,000 characters", "Access-Control-Allow-Origin"]:
              if required_text not in function:
                  raise SystemExit("Edge Function is missing: " + required_text)
          rules_file = Path("supabase/functions/analyze-message/rules.ts")
          test_file = Path("supabase/functions/analyze-message/rules_test.ts")
          if not rules_file.exists() or not test_file.exists():
              raise SystemExit("Scam detection rules or regression tests are missing")
          migration = Path("supabase/migrations/20261029020000_community_features.sql")
          if not migration.exists():
              raise SystemExit("Community features migration is missing")
          print("Required app and backend features found.")
          PY
          node --check /tmp/scamcheck-app.js
          deno check supabase/functions/analyze-message/index.ts\n          deno test supabase/functions/analyze-message/rules_test.ts
